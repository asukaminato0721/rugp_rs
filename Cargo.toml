[package]
name = "rugp_rs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
rugp_assets = { path = "crates/rugp_assets" }
rugp_scene_vm = { path = "crates/rugp_scene_vm" }
rugp_runtime = { path = "crates/rugp_runtime" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
png = "0.18"

[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:softbuffer"]
audio = ["rugp_runtime/device-audio"]

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

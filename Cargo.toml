[package]
name = "rugp_rs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
rugp_assets = { path = "crates/rugp_assets" }
rugp_scene_vm = { path = "crates/rugp_scene_vm" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
png = "0.18"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
